name: pst-inventory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pst
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pst_inventory
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pst -d pst_inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pst:${DB_PASSWORD}@db:5432/pst_inventory?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3010}:3000"

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U pst pst_inventory | gzip > /backups/pst-$$(date +%Y-%m-%d).sql.gz &&
        ls -1t /backups/pst-*.sql.gz | tail -n +15 | xargs -r rm --;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
